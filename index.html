<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PKチャレンジ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="wrapper">
    <h1 class="heading-title">PKチャレンジ</h1>
    <div class="marks text-center">
      <img class="mark1" src="images/mark_next.svg" alt="1本目" />
      <img class="mark2" src="images/mark_mada.svg" alt="2本目" />
      <img class="mark3" src="images/mark_mada.svg" alt="3本目" />
      <img class="mark4" src="images/mark_mada.svg" alt="4本目" />
      <img class="mark5" src="images/mark_mada.svg" alt="5本目" />
    </div>
    <div class="kick-text text-center">PKチャレンジ スタート！</div>
    <div class="score-text text-center">5本中3本決めたら勝利</div>
    <div class="field">
      <img class="crowd" src="images/crowd.svg" alt="観客" />
      <p class="kansei"></p>
      <img class="keeper" src="images/keeper.svg" alt="キーパー" />
      <img class="ball" src="images/ball.svg" alt="ボール" />
      <p class="sfx-shot">ドゴォッ！！</p>
      <p class="sfx"></p>
    </div>
    <div class="ban-text text-center">1本ごとに 10000通りのどれかが起きます</div>
    <div class="result text-center">
      <p class="result-text">蹴る方向を選んでください</p>
    </div>
    <p class="meigen text-center"></p>

    <div class="button-area text-center">
      <button class="hidariue-button">左上</button>
      <button class="migiue-button">右上</button>
      <button class="hidarishita-button">左下</button>
      <button class="migishita-button">右下</button>
      <button class="mannaka-button">真ん中</button>
      <button class="reset-button">もう一回</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
